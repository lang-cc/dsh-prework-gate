# Inserts this bundle's Host plugin row into the profile.
# Toggle with `enabled: false`; tune the brake, the grilling round and the
# cleanup tool from the `config` block below.
- insert:
    - id: prework-gate
      name: 'dsh-prework-gate'
      config:
        enabled: true
        order: 400
        strictness: adaptive
        extraRules: []
        grill: true
        gate: true
        gateMode: prompt-first
        allowReadOnlyShell: true
        gatedTools: []
        approvalTtlMinutes: 120
        cleanup: true
        maxCleanupPerRun: 50
